name: Crawl QEF statements

on:
  schedule:
    # 07:20 UTC daily (~03:20 Toronto). Off the hour on purpose: GitHub queues
    # scheduled jobs heavily at :00. Even so it routinely starts hours late;
    # that is GitHub's free scheduler and nothing here depends on the time.
    - cron: "20 7 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated family ids (blank = all)"
        required: false
      static_only:
        description: "Skip headless-browser families"
        type: boolean
        default: false
      since_year:
        description: "Oldest fund tax year to index"
        required: false
        default: "2021"
      refresh:
        description: "Re-read every listed document, ignoring the cache (use with 'only')"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    # Pinned, not "ubuntu-latest": that label moves to a new Ubuntu release
    # without notice, and the browser's system packages have to exist for it.
    runs-on: ubuntu-24.04
    # A normal night takes about 25 minutes. A cold cache (first run, or a
    # cache eviction) is a full rebuild of ~90 minutes, so leave real headroom:
    # a cancelled run publishes nothing and reports nothing.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r crawler/requirements.txt

      # Never crawl with a crawler whose own tests fail. They take well under
      # a second and need no network.
      - name: Test the crawler
        run: python -m unittest discover -s tests

      # Chromium is only needed for a few hub pages. It must never sink the
      # whole run: on 11 Nov 2026 this step hung for ten minutes and failed, so
      # nothing was crawled at all. Without it the crawler still does every
      # family that needs no browser and keeps the rest from the cache.
      - name: Install Chromium
        continue-on-error: true
        timeout-minutes: 8
        run: python -m playwright install --with-deps chromium || python -m playwright install chromium

      # The cache is what makes a nightly run cheap: without it every run
      # re-downloads the entire back catalogue.
      - name: Restore crawl cache
        uses: actions/cache/restore@v6
        with:
          path: crawler/.cache
          key: qef-cache-${{ github.run_id }}
          restore-keys: qef-cache-

      - name: Crawl
        id: crawl
        env:
          ONLY: ${{ github.event.inputs.only }}
          STATIC_ONLY: ${{ github.event.inputs.static_only }}
          REFRESH: ${{ github.event.inputs.refresh }}
          SINCE: ${{ github.event.inputs.since_year }}
        run: |
          set -o pipefail
          # The year floor must be passed explicitly. crawl.py's own default is
          # 2015, so leaving it off would quietly widen every nightly run to six
          # extra years of back catalogue that we deliberately excluded.
          ARGS=(--since-year "${SINCE:-2021}")
          # Inputs arrive through the environment and are split into separate
          # arguments here, so nothing typed into the form is run as a command.
          if [ -n "$ONLY" ]; then read -r -a IDS <<< "$ONLY"; ARGS+=(--only "${IDS[@]}"); fi
          if [ "$STATIC_ONLY" = "true" ]; then ARGS+=(--static-only); fi
          if [ "$REFRESH" = "true" ]; then ARGS+=(--refresh); fi
          echo "Running: crawl.py ${ARGS[*]}"
          python crawler/crawl.py "${ARGS[@]}" 2>&1 | tee crawl.log
          {
            echo '### Crawl summary'
            echo '```'
            tail -40 crawl.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Only when there is a cache to save: saving an empty directory after an
      # early failure would be restored as "the cache" the following night.
      - name: Save crawl cache
        if: always() && hashFiles('crawler/.cache/manifest.json') != ''
        uses: actions/cache/save@v6
        with:
          path: crawler/.cache
          key: qef-cache-${{ github.run_id }}

      - name: Commit index
        run: |
          git config user.name  "qef-crawler"
          git config user.email "actions@users.noreply.github.com"
          git add web/data/index.json web/data/hosts.json
          if git diff --staged --quiet; then
            echo "No index change."
            exit 0
          fi
          STATS=$(python -c "
          import json
          d = json.load(open('web/data/index.json'))
          s = d['stats']
          crawled = [h for h in d['health'] if h['status'] not in ('manual', 'none')]
          ok = sum(h['status'] == 'ok' for h in crawled)
          print(f\"{s['funds']} funds, {s['statements']} statements, {ok}/{len(crawled)} sources ok\")
          ")
          git commit -m "index: $STATS"
          # Pushing is what publishes the site: Cloudflare rebuilds on every
          # commit. If something else was pushed while the crawl ran, put this
          # commit on top of it rather than failing and publishing nothing.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt); rebasing onto the latest master."
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          done
          echo "Could not push the refreshed index." >&2
          exit 1

      # A source that silently stops returning statements is the main failure
      # mode for this kind of tool, so make it loud.
      - name: Report sources needing attention
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let idx;
            try { idx = JSON.parse(fs.readFileSync('web/data/index.json','utf8')); }
            catch { return; }
            // "blocked" belongs here. It was left out at first, so BlackRock
            // sat blocked for weeks without this report ever mentioning it.
            const broken = (idx.health||[]).filter(h =>
              ['down','error','empty','blocked'].includes(h.status));
            const title = 'Crawler: sources need attention';
            const existing = (await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'crawler'
            })).data.find(i => i.title === title);

            if (!broken.length) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `All sources healthy as of ${idx.generated}. Closing.`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, state: 'closed'
                });
              }
              return;
            }

            const cell = s => String(s ?? '').replace(/\|/g, '\\|').replace(/\s+/g, ' ');
            const body = [
              `Crawl of ${idx.generated} found ${broken.length} source(s) needing attention.`,
              '',
              '| Family | Status | Listed | Verified | Message |',
              '|---|---|---:|---:|---|',
              ...broken.map(h => `| [${cell(h.name)}](${h.hub}) | \`${h.status}\` | ${h.candidates} | ${h.statements} | ${cell(h.message)} |`),
              '',
              'What the statuses mean:',
              '- `empty` - the page loaded but no statements were found on it. Usually the manager reorganised the page and the entry in `crawler/sources.yaml` needs updating.',
              '- `blocked` - the manager\'s server refused the requests. Statements already collected are kept. If it lasts more than a few nights, look at it.',
              '- `down` - the page could not be reached at all.',
              '- `error` - the crawler itself failed on this family; see the run log.',
              '',
              'Nothing already in the index is removed while a source is in one of these states.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['crawler']
              });
            }
