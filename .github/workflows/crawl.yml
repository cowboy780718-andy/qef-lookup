name: Crawl QEF statements

on:
  schedule:
    # 07:20 UTC daily (~03:20 Toronto). Off the hour on purpose: GitHub queues
    # scheduled jobs heavily at :00 and delays can run to tens of minutes.
    - cron: "20 7 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated family ids (blank = all)"
        required: false
      static_only:
        description: "Skip headless-browser families"
        type: boolean
        default: false
      since_year:
        description: "Oldest fund tax year to index"
        required: false
        default: "2021"

permissions:
  contents: write
  issues: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r crawler/requirements.txt

      # Chromium is only needed for the WAF-protected hub pages. The PDFs
      # themselves fetch fine over plain HTTP.
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # The PDF cache is what makes a nightly run cheap: without it every run
      # re-downloads the entire back catalogue.
      - name: Restore crawl cache
        uses: actions/cache/restore@v4
        with:
          path: crawler/.cache
          key: qef-cache-${{ github.run_id }}
          restore-keys: qef-cache-

      - name: Crawl
        id: crawl
        run: |
          set -o pipefail
          # The year floor must be passed explicitly. crawl.py's own default is
          # 2015, so leaving it off would quietly widen every nightly run to six
          # extra years of back catalogue that we deliberately excluded.
          SINCE="${{ github.event.inputs.since_year }}"
          ARGS="--since-year ${SINCE:-2021}"
          if [ -n "${{ github.event.inputs.only }}" ]; then ARGS="$ARGS --only ${{ github.event.inputs.only }}"; fi
          if [ "${{ github.event.inputs.static_only }}" = "true" ]; then ARGS="$ARGS --static-only"; fi
          echo "Running: crawl.py $ARGS"
          python crawler/crawl.py $ARGS 2>&1 | tee crawl.log
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          tail -25 crawl.log >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Save crawl cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: crawler/.cache
          key: qef-cache-${{ github.run_id }}

      - name: Commit index
        run: |
          git config user.name  "qef-crawler"
          git config user.email "actions@users.noreply.github.com"
          git add web/data/index.json
          if git diff --staged --quiet; then
            echo "No index change."
            # Still push an empty-tree touch? No - GitHub only disables cron
            # after 60 days with no *repository* activity, and the index does
            # change at least monthly during filing season.
          else
            STATS=$(python -c "import json;d=json.load(open('web/data/index.json'));s=d['stats'];print(f\"{s['funds']} funds, {s['statements']} statements, {s['families_ok']}/{s['families']} sources ok\")")
            git commit -m "index: $STATS"
            # Pushing here is what publishes the site: the Worker is connected
            # to this repo, so the commit triggers a Cloudflare rebuild.
            git push
          fi

      # A source that silently stops returning statements is the main failure
      # mode for this kind of tool, so make it loud.
      - name: Report broken sources
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let idx;
            try { idx = JSON.parse(fs.readFileSync('web/data/index.json','utf8')); }
            catch { return; }
            const broken = (idx.health||[]).filter(h => ['down','error','empty'].includes(h.status));
            const title = 'Crawler: sources need attention';
            const existing = (await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'crawler'
            })).data.find(i => i.title === title);

            if (!broken.length) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `All sources healthy as of ${idx.generated}. Closing.`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, state: 'closed'
                });
              }
              return;
            }

            const body = [
              `Crawl of ${idx.generated} found ${broken.length} source(s) needing attention.`,
              '',
              '| Family | Status | Candidates | Verified | Message |',
              '|---|---|---:|---:|---|',
              ...broken.map(h => `| [${h.name}](${h.hub}) | \`${h.status}\` | ${h.candidates} | ${h.statements} | ${h.message||''} |`),
              '',
              '`empty` usually means the manager reorganised their tax page and the',
              'link filter in `crawler/sources.yaml` needs updating.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['crawler']
              });
            }
