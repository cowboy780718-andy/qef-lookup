    verified: 2026-08-18
    verified_by: manual
    note: >-
      Managers generally do not post statements for registered retirement
      accounts. This is about what managers publish, not about the reporting
      obligation for any account type.
    action: >-
      Nothing to fetch for RRSPs and RRIFs. TFSAs and RESPs are NOT covered by
      this and generally do need PFIC reporting.

