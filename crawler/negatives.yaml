# Negative findings register
#
# "No QEF statement could be located for this fund" is a research result with
# the same working-paper value as a found PDF. Recording it here means the
# question is answered once, permanently.
#
# WORDING MATTERS. These entries record what was found on a manager's public
# website on a given date. They are NOT assertions that a manager refuses to
# issue a statement, and must never be written that way - a statement may well
# be available on request. Say "could not be located", never "does not issue".
#
# Each entry needs:
#   scope        - what the finding covers (fund family, a fund range, one fund)
#   note         - ONE sentence: why there is nothing to list
#   action       - ONE sentence: what the reader should do about it
#   finding      - not_offered | offered_on_request | registered_only | unreachable
#   evidence     - a URL a reviewer can open, or a documented statement by the manager
#   verified     - ISO date the finding was last confirmed
#   verified_by  - crawler | manual
#
# The crawler re-checks `evidence` on each run and flags entries whose source
# page has changed, so a negative cannot silently go stale.

negatives:

  - scope: CIBC-branded mutual funds, CIBC Index Funds, CIBC Managed Portfolios, Axiom Portfolios
    family: cibc
    finding: not_available
    evidence: https://www.cibc.com/en/personal-banking/investments/mutual-funds/reporting-and-governance.html
    verified: 2026-08-18
    verified_by: manual
    note: >-
      CIBC's own reporting and governance page says unitholders of these funds
      do not receive PFIC statements.
    action: >-
      None to fetch. CIBC's Renaissance and Imperial Pools funds do have
      statements - search those names.

