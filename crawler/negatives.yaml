# Negative findings register
#
# "No QEF statement could be located for this fund" is a research result with
# the same working-paper value as a found PDF. Recording it here means the
# question is answered once, permanently.
#
# WORDING MATTERS. These entries record what was found on a manager's public
# website on a given date. They are NOT assertions that a manager refuses to
# issue a statement, and must never be written that way - a statement may well
# be available on request. Say "could not be located", never "does not issue".
#
# Each entry needs:
#   scope        - what the finding covers (fund family, a fund range, one fund)
#   finding      - not_offered | offered_on_request | registered_only | unreachable
#   evidence     - a URL a reviewer can open, or a documented statement by the manager
#   verified     - ISO date the finding was last confirmed
#   verified_by  - crawler | manual
#
# The crawler re-checks `evidence` on each run and flags entries whose source
# page has changed, so a negative cannot silently go stale.

negatives:

  - scope: CIBC-branded mutual funds, CIBC Index Funds, CIBC Managed Portfolios, Axiom Portfolios
    family: cibc
    finding: not_available
    evidence: https://www.cibc.com/en/personal-banking/investments/mutual-funds/reporting-and-governance.html
    verified: 2026-08-18
    verified_by: manual
    note: >-
      CIBC's own reporting and governance page states that unitholders of these
      funds do not receive PFIC Annual Information Statements - this one is the
      manager's own wording, not an inference. Sister brands Renaissance and
      Imperial Pools do receive them: same bank, opposite answer, which is the
      canonical case for why this register exists.

  - scope: Renaissance HISA, Renaissance Money Market funds
    family: renaissance
    finding: not_available
    evidence: https://www.renaissanceinvestments.ca/reporting-governance/pfic
    verified: 2026-08-18
    verified_by: manual

  - scope: All funds held inside RRSPs and RRIFs
    family: '*'
    finding: not_available
    evidence: https://www.cibc.com/en/personal-banking/investments/mutual-funds/reporting-and-governance.html
    verified: 2026-08-18
    verified_by: manual
    note: >-
      Managers generally do not post statements for registered retirement
      accounts. Note this is about the manager's publishing practice only, and
      is not a conclusion about the treaty position or reporting obligation for
      any particular account type. TFSAs and RESPs are NOT covered by this
      exclusion and generally do need PFIC reporting.

  - scope: Fidelity Canada non-ETF mutual fund series
    family: fidelity-ca
    finding: offered_on_request
    evidence: https://www.fidelity.ca/en/pfic_etf_statements/
    verified: 2026-08-18
    verified_by: manual
    note: >-
      Only ETF and ETF Series statements are published on the website.
      Personalized statements for other series are issued on request, so absence
      from the index is not evidence that none can be obtained - call the manager.

  - scope: Capital Group Canada - all funds
    family: capitalgroup-ca
    finding: manual_only
    evidence: https://www.capitalgroup.com/robots.txt
    verified: 2026-08-18
    verified_by: crawler
    note: >-
      Capital Group DOES publish PFIC Annual Information Statements for its
      Canadian funds - this is not a "no statement" finding. But
      capitalgroup.com/robots.txt sets a blanket `Disallow: /content`, and every
      document lives under /content/dam/, so the crawler will not fetch them.
      Open the tax centre and download by hand. If robots.txt is relaxed, drop
      the `access: manual` flag in sources.yaml and this entry.

  - scope: Evolve ETFs - all funds, including Evolve Future Leadership Fund
    family: evolve
    finding: not_available
    evidence: https://evolveetfs.com/?s=PFIC
    verified: 2026-08-19
    verified_by: manual
    note: >-
      No PFIC or QEF material could be located on evolveetfs.com as at this
      date: a site search for "PFIC" returned nothing, there is no
      tax-information section, and the documents area carries prospectuses and
      fund facts only. This records what was found on their public website. It
      is not a statement about whether Evolve issues one - ask them directly.
      If no statement can be obtained, the holding falls to the section 1291
      excess distribution regime, or a mark-to-market election if the fund is
      marketable on a qualified exchange.

  - scope: Bridgehouse Asset Managers - all funds, including GQG Partners Global Quality Equity Fund
    family: bridgehouse
    finding: not_available
    evidence: https://www.bridgehousecanada.com/?s=PFIC
    verified: 2026-08-19
    verified_by: manual
    note: >-
      No PFIC material could be located on the Bridgehouse website as at this
      date. Look under Bridgehouse, not GQG - GQG Partners is the sub-advisor;
      Bridgehouse is the Canadian manager and the party that would issue the
      statement. Their Legal & Regulatory page lists Fund Facts, Prospectus,
      Annual Information Form and proxy records, with nothing on PFIC, QEF or
      US taxpayers, and a site search for "PFIC" returned nothing. This records
      what was found on their public website, not whether Bridgehouse issues
      one - contact them directly to ask.
