# QEF / PFIC statement source registry
#
# Adding a family = adding a block here. No code changes required.
#
#   mode: static   -> plain HTTP fetch (fast, cheap)
#   mode: browser  -> rendered with headless Chromium (JS-built document lists)
#   fye:           -> fund fiscal year end, "MM-DD", or "varies" if mixed/unknown.
#                     The crawler always prefers the period it reads out of the PDF;
#                     this is only a fallback and a sanity check.
#   link_include:  -> regexes; a PDF link must match one to be considered
#   link_exclude:  -> regexes; overrides include

defaults:
  link_include:
    - '(?i)pfic'
    - '(?i)qef'
    # SPEP = Societe de Placement Etranger Passif, the French for PFIC.
    # Quebec and bilingual managers name their files with it: Desjardins
    # publishes fnb_doc_spep_2022_en.pdf. Searching only for "pfic" missed
    # Desjardins entirely and reported it as "not found", which was wrong -
    # they publish, the crawler was looking for the wrong word.
    - '(?i)spep'
    - '(?i)fepp'
  link_exclude:
    - '(?i)(faq|q-and-a|q_and_a|overview|sample|guide|brochure)'

families:

  # ---------- Tier A: static HTML, direct PDF links ----------

  - id: mackenzie
    name: Mackenzie Investments
    country: CA
    mode: static
    fye: "12-31"
    hub: https://www.mackenzieinvestments.com/en/legal-and-privacy/passive-foreign-investment-company-statements
    link_include: ['(?i)/pfic/pfic-\d{4}-.+\.pdf']
    notes: >-
      Most predictable publisher found. URL form:
      /content/dam/mackenzie/en/pfic/pfic-{YEAR}-{CODE}-en.pdf
      Both EN and FR posted; we take EN. Statements are not mailed to investors.

  - id: tdam
    name: TD Asset Management
    country: CA
    mode: static
    fye: "12-31"
    hub: https://www.td.com/ca/en/asset-management/resources/pfic-reporting
    link_include: ['(?i)/pfic/.+\.pdf', '(?i)mftpfic.+\.pdf']
    notes: >-
      Path root has moved between years (/content/dam/tdcom/... and
      /ca/en/asset-management/documents/...). Both are matched; content
      verification decides what is real.

  - id: vanguard-ca
    name: Vanguard Investments Canada
    country: CA
    mode: static
    fye: "12-31"
    hub: https://www.vanguard.ca/en/tools-and-resources/tax-centre
    link_include: ['(?i)_PFIC.*\.pdf', '(?i)pfic-[A-Z]{2,5}\.pdf']
    notes: >-
      Two hosts in play: fund-docs.vanguard.com (older) and
      www.vanguard.ca/content/dam/... (current). Ticker embedded in filename.

  - id: russell-ca
    name: Russell Investments Canada
    country: CA
    mode: static
    fye: "12-31"
    hub: https://russellinvestments.com/content/ri/ca/en/legal/pfic.html
    link_include: ['(?i)/\d{4}/pfic/.+\.pdf', '(?i)pfic.*\.pdf']
    notes: Year is a path segment - /legal/{YEAR}/pfic/. Fund code often prefixes the filename.

  - id: ci-gam
    name: CI Global Asset Management
    country: CA
    mode: static
    fye: "03-31"
    hub: https://funds.cifinancial.com/en/funds/pfic-documents
    link_include: ['(?i)Passive_Foreign_Investment_Company.+\.pdf']
    link_exclude: ['(?i)IRS_Form']
    notes: >-
      Hub is ~17MB and links the entire CI document catalog (~15k PDFs), so the
      include filter is doing heavy lifting. Fund identity lives in an opaque
      numeric path segment, so identity must come from PDF text, not the URL.

  - id: mawer
    name: Mawer Investment Management
    country: CA
    mode: static
    fye: "12-31"
    hub: https://www.mawer.com/documents
    link_include: ['(?i)pfic']
    link_section:
      start: '>\s*PFIC\s*</div>\s*</button>'
      end: '<div class="tw-font-\[800\]'
    notes: >-
      Served from an Azure CDN. The documents page has a "PFIC" accordion
      holding one statement per fund for the latest year only, and since the
      2025 statements the files are named by content hash
      (26776e52...71.pdf), not by fund - so they are collected by where they
      sit on the page (link_section), not by filename. Earlier naming:
      2023 -> /assets/documents/{fund}-pfic-reporting-dec-31-2023.pdf
      2024 -> /assets/documents/pfic/{fund}-pfic-reporting-2024.pdf

  - id: cibc
    name: CIBC Asset Management
    country: CA
    mode: static
    fye: "12-31"
    hub: https://www.cibc.com/en/personal-banking/investments/mutual-funds/reporting-and-governance/etf-pfic-annual-statement.html
    link_include: ['(?i)pfic-etf-.+\.pdf', '(?i)pfic.+\.pdf']
    notes: >-
      IMPORTANT: CIBC-branded mutual funds, CIBC Index Funds, Managed Portfolios
      and Axiom Portfolios receive NO statement. Renaissance and Imperial Pools do
      (see the renaissance family). Seeded as negatives in negatives.yaml.

  - id: blackrock-ishares-ca
    name: BlackRock / iShares Canada
    country: CA
    mode: static
    fye: "12-31"
    hub: https://www.blackrock.com/ca/investors/en/resources/tax-information-centre
    link_include: ['(?i)pfic-stmt-\d{4}-.+\.pdf']
    derive:
      kind: ticker_list_pdf
      list_url: https://www.blackrock.com/ca/investors/en/literature/tax-information/pfic-fund-list-en-ca.pdf
      pair_pattern: '(iShares(?:(?!iShares).)*?(?:ETF|Portfolio)(?:\s*\([^)]*\))?)\s+([A-Z]{2,5})(?=\s|$)'
      url_templates:
        - https://www.blackrock.com/ca/investors/en/literature/tax-information/pfic-stmt-{year}-{ticker_lower}-env1.pdf
        - https://www.blackrock.com/ca/investors/en/literature/tax-information/pfic-stmt-{year}-{ticker_lower}-en-v1.pdf
      years_back: 5
    notes: >-
      The tax centre links only the "Fund List - PFIC Statements" roster, never
      the statements themselves, so this family is derived: read the roster for
      fund/ticker pairs, then probe the statement path per ticker and year.
      Two filename shapes are in use (-env1 and -en-v1) and BlackRock alternates
      between them inconsistently across years and funds, so both are tried.
      Misses are cached, so only the first run is expensive.

  - id: capitalgroup-ca
    name: Capital Group Canada
    country: CA
    mode: static
    fye: "12-31"
    hub: https://www.capitalgroup.com/advisor/ca/en/service/tax-centre.html
    link_include: ['/AIS_[A-Za-z0-9]+\.pdf']
    listing_only:
      why: >-
        capitalgroup.com/robots.txt disallows /content, where every document is kept
    caveat: >-
      Capital Group posts one statement per fund at a fixed address and
      replaces it each year, so each link leads to the latest year only.
      Earlier years have to be requested from Capital Group.
    notes: >-
      LINKS ONLY, by their instruction. capitalgroup.com/robots.txt carries a
      blanket `Disallow: /content`, and every document including the PFIC
      statements lives under /content/dam/. The tax centre page itself may be
      read, and it names each fund beside its statement (AIS_{CODE}.pdf), so
      the links are listed without the documents ever being requested.
      Revisit if robots.txt changes.

  - id: fidelity-ca
    name: Fidelity Investments Canada
    country: CA
    mode: static
    fye: "varies"
    hub: https://www.fidelity.ca/en/pfic_etf_statements/
    caveat: >-
      Fidelity reports amounts per unit PER DAY. Only ETF and ETF Series
      statements are posted; for other series Fidelity issues a personalized
      statement on request.
    link_include: ['(?i)/pfic/\d{4}/.+\.pdf', '(?i)pfic_\d{4}_.+\.pdf']
    notes: >-
      Reports per unit PER DAY - unit-days must be computed to file.
      Some funds run to April 30. Personalized statements are available on
      request for non-ETF series, which cannot be crawled.

  - id: ia-clarington
    name: iA Clarington Investments
    country: CA
    mode: static
    fye: "12-31"
    hub: https://iaclarington.com/applicationsandforms/pficstatements
    link_include: ['(?i)/pfic/\d{4}/ais/.+\.pdf']
    listing_only:
      why: >-
        iaclarington.com/robots.txt disallows /docs/, where every statement is kept
    notes: >-
      LINKS ONLY, by their instruction. Their robots.txt opens with
      "Allow: /*" and then "Disallow: /docs/"; read by the longest-match rule
      that is a disallow, and every statement lives under
      /docs/default-source/distributions-and-taxes/pfic/{year}/ais/. The page
      that lists them may be read and names each fund, so the links are listed
      without the documents being requested. The same folder holds
      /pfic/{year}/8937/ - Form 8937 is a different filing and is left out.

  - id: renaissance
    name: Renaissance Investments (CIBC)
    country: CA
    mode: static
    fye: "12-31"
    hub: https://www.renaissanceinvestments.ca/reporting-governance/pfic
    notes: >-
      Covers Renaissance funds, Renaissance Private Pools and Imperial Pools.
      Renaissance HISA and Money Market funds are excluded by the manager.

  # ---------- Tier C: statements published as HTML tables, not documents ----------

  - id: hamilton-etfs
    name: Hamilton ETFs
    country: CA
    mode: browser
    doc_type: html_table
    fye: "04-30"
    hub: https://hamiltonetfs.com/tax-information/
    caveat: >-
      Hamilton publishes these as a table on its website, not as a document,
      and reports amounts per unit PER DAY.
    statement_pages:
      - https://hamiltonetfs.com/tax-information/pfic/
      - https://hamiltonetfs.com/tax-information/pfic-annual-information-statements-2025/
    # New years are picked up automatically: any page the hub (or a page
    # above) links whose address matches this is read as a statement page.
    statement_page_pattern: '(?i)hamiltonetfs\.com/tax-information/pfic[^/]*/?$'
    notes: >-
      There is no document to download - the statement IS a table on the page,
      so the rows are captured and reproduced verbatim. April 30 year end.
      Figures are per unit PER DAY, so unit-days must be computed to file.
      Coverage narrows sharply between years: the 2024 page lists 20 ETFs
      including HBA, the 2025 page only 6. Absence from the newer page is a
      real finding, not a crawl failure - check with the manager.
      The URL pattern changes each year (2024 lives at /pfic/, 2025 at
      /pfic-annual-information-statements-2025/, 2026 at ...-2026/), so new
      pages are discovered from the hub rather than listed by hand.

  # ---------- Tier B: JavaScript-rendered document lists ----------

  - id: rbc-gam
    name: RBC Global Asset Management / PH&N
    country: CA
    mode: browser
    fye: "06-30"
    hub: https://www.rbcgam.com/en/ca/products/pfic-reporting
    notes: >-
      Fund family -> fund -> series cascading menus, PDF revealed per selection.
      Series A, D, F, FT, H, I, O. Years 2021-2025 confirmed available.
      June 30 fiscal year end - do NOT assume December.

  - id: bmo-gam
    name: BMO Global Asset Management
    country: CA
    mode: static
    fye: "06-30"
    hub: https://bmogam.com/ca-en/resources/legal-and-regulatory-documents/pfic/
    link_include: ['(?i)pfic']
    notes: >-
      June 30 fiscal year end for most funds - do NOT assume December.
      Next.js site: the markup contains no document links at all. All ~220
      statement URLs live in the __NEXT_DATA__ JSON blob and point at
      bmo.bynder.com, which is why link scraping found nothing. Plain HTTP
      times out and headless Chromium fails with an HTTP/2 protocol error;
      curl is the transport that works.

  - id: manulife-im
    name: Manulife Investment Management
    country: CA
    mode: browser
    fye: "12-31"
    hub: https://www.manulifeim.com/retail/ca/en/regulatory/passive-foreign-investment-company-pfic
    link_include: ['(?i)/landing-page/product/pdf/.+\.pdf', '(?i)pfic']
    follow:
      page_pattern: '(?i)/resources/all/regulatory/[^"]*pfic'
    notes: >-
      NOT login-gated, but blocks both Python AND headless Chromium; only curl
      gets through, which is why the crawler has three fetch paths.
      Two-level: the hub links ~61 per-fund landing pages, each holding exactly
      one statement PDF under /content/dam/mim-ca/landing-page/product/pdf/.
      Following those pages is the only way to reach the documents.

  - id: globalx-ca
    name: Global X Investments Canada (formerly Horizons)
    country: CA
    mode: browser
    fye: "12-31"
    hub: https://www.globalx.ca/pfic
    caveat: >-
      Global X publishes one combined table for all its ETFs, reporting
      amounts per unit PER DAY. The link opens it at the page this fund is on.
    split:
      by: rows
      name_prefix: Global X
    notes: >-
      WordPress; PDFs under /wp-content/uploads/{YYYY}/{MM}/.
      One combined document per year: a table with a row for every ETF,
      followed by a page of indirect ("direct investee") amounts for each
      fund-of-funds. Each row is indexed as its own fund, opening the document
      at the page the row is on. Reports per unit PER DAY. April 30 year end.
      robots.txt asks for a 30-second crawl delay, which is honoured.

  - id: purpose
    name: Purpose Investments
    country: CA
    mode: static
    fye: "12-31"
    hub: https://www.purposeinvest.com/funds
    link_include: ['(?i)/Docs/[^/]+/pfic/']
    follow:
      page_pattern: '^/funds/[a-z0-9-]+$'
    notes: >-
      Two-level, like Manulife. The /funds index links ~87 individual fund
      pages, and each fund page links exactly one PFIC statement at
      documents.purposeinvest.com/Docs/{CODE}/pfic/en/{Fund Name} PFIC
      {YYYY-MM-DD}.pdf. Nothing PFIC-related appears on the index itself,
      which is why the earlier single-level crawl found zero.
      The originally bookmarked URL was a single fund page, not a hub.

  - id: sunlife-gi
    name: Sun Life Global Investments
    country: CA
    mode: static
    access: request
    fye: "12-31"
    hub: https://www.sunlifeglobalinvestments.com/en/resources/regulatory-documents/#regulatorydocuments-id-4
    guidance: >-
      Sun Life provides PFIC statements for 17 of its funds on request only -
      they are not posted online (checked 11 November 2026).
    action: >-
      Ask the client's advisor to request it through the Sun Life Wealth
      Distribution sales team.
    # Fund names the manager lists as having a statement. Searching one of
    # these brings up the guidance above instead of "nothing matched".
    covers:
      - Sun Life Granite Balanced Growth Portfolio
      - Sun Life Granite Balanced Portfolio
      - Sun Life MFS Diversified Income Fund
      - Sun Life MFS Global Growth Fund
      - Sun Life MFS Global Value Fund
      - Sun Life MFS International Opportunities Fund
      - Sun Life MFS International Value Fund
      - Sun Life MFS U.S. Growth Fund
      - Sun Life MFS U.S. Mid Cap Growth Fund
      - Sun Life MFS U.S. Value Fund
      - Sun Life Core Advantage Credit Private Pool
      - Sun Life KBI Sustainable Infrastructure Private Pool
      - Sun Life Real Assets Private Pool
      - Sun Life Money Market Fund
      - Sun Life MFS Global Growth Class
      - Sun Life MFS International Opportunities Class
      - Sun Life MFS U.S. Growth Class
    notes: >-
      Issued on request only - their own page says so. Checked 2026-11-11.

  - id: pimco-ca
    name: PIMCO Canada
    country: CA
    mode: browser
    access: manual
    fye: "varies"
    hub: https://www.pimco.com/ca/en/resources/tax-center
    guidance: >-
      PIMCO posts its PFIC statements, but its website blocks automated tools,
      so they cannot be collected here.
    action: >-
      Open PIMCO's tax centre, expand the year you need and
      search the fund name.
    notes: >-
      PUBLISHES, BUT CANNOT BE CRAWLED. The tax centre carries sections headed
      "2025 / 2024 / 2023 U.S. Taxpayer PFIC / Form 8937 Information", so the
      statements exist. Their contents never load: the panels sit at
      "Loader..." indefinitely in headless Chromium even after the consent
      banner is dismissed, and no data request is issued that could be followed.
      Open the tax centre and expand the year you need by hand. Retry
      periodically - this is a site behaviour, not a policy.

  - id: dimensional-ca
    name: Dimensional Fund Advisors Canada
    country: CA
    mode: static
    fye: "12-31"
    hub: https://www.dimensional.com/ca-en/document-center
    caveat: >-
      Dimensional posts one statement per fund and replaces it each year, so
      only the latest year is available here. Earlier years have to be
      requested from Dimensional.
    json_api:
      url: https://www.dimensional.com/investment-api/v2/document-grid
      body: '{"gridid":"$TOKEN"}'
      token_pattern: 'data-gridid="([^"]+)"'
      # Used only if the page arrives without one, as it does on GitHub's runners.
      token_default: '{1661EFCE-BEDE-4332-A71C-4234DD3ED840}'
    notes: >-
      The document centre is an empty shell that loads its list from the
      document-grid endpoint, so the list is read from that endpoint directly
      (the grid id is read fresh off the page each night). One statement per
      fund at a fixed address with no year in it - each year's statement
      REPLACES the last at the same URL, so only the latest year is ever
      available here; earlier years have to be requested from Dimensional.

  # ---------- Confirmed non-publishers, listed so the check is visible ----------

  - id: evolve
    name: Evolve ETFs
    country: CA
    mode: static
    fye: "06-30"
    hub: https://evolveetfs.com/
    link_include: ['(?i)_AIS\.pdf']
    name_fix:
      - ['^EVOLVE\b', 'Evolve']
    follow:
      page_pattern: '^https://evolveetfs\.com/product/[a-z0-9-]+/$'
      ticker_pattern: '/product/([a-z0-9]+)'
    caveat: >-
      Evolve began issuing PFIC statements in October 2026, for certain funds
      only and starting with the year ended 30 June 2025. Its announcement
      named six: EBNK, BOND, CYBR, ESPX, QQQT and QQQY. For any other Evolve
      fund no statement was found on its website - ask Evolve.
    notes: >-
      Until October 2026 nothing about PFIC could be found on evolveetfs.com
      and this family was recorded as "none". On 14 October 2026 Evolve
      announced statements for certain funds (June 30 year end), posted among
      each fund's documents on its /product/{ticker}/ page as
      ..._{YEAR}_AIS.pdf. There is no single list, so every product page
      linked from the home page is read; the list "may change without notice".
      Announcement:
      https://evolveetfs.com/2026/10/evolve-to-provide-pfic-reporting-for-u-s-taxpayer-investors-for-certain-evolve-funds/

  - id: bridgehouse
    name: Bridgehouse Asset Managers (incl. GQG Partners funds)
    country: CA
    mode: static
    access: none
    fye: "12-31"
    hub: https://www.bridgehousecanada.com/
    guidance: >-
      No PFIC statement is available on Bridgehouse's website: its Legal &
      Regulatory page has nothing on PFIC, QEF or US taxpayers (checked 19
      August 2026).
    action: >-
      Contact Bridgehouse to ask for one - Bridgehouse, not the sub-advisor
      GQG Partners, is the manager that would provide it.
    notes: Checked 2026-08-19. Covers the GQG Partners Global Quality Equity Fund.

  - id: dynamic
    name: Dynamic Funds (1832 Asset Management)
    country: CA
    mode: static
    fye: "12-31"
    hub: https://dynamic.ca/en/regulatory/statutory-documents-applications-and-forms/pfic-irs.html
    extra_hubs:
      - https://dynamic.ca/en/regulatory/statutory-documents-applications-and-forms/pfic-irs/archive.html
    link_include: ['(?i)/content/dam/docs/regulatory/pfic/\d{4}/.+\.pdf']
    # The text layer of these statements splits the first word: "Dy namic ...".
    name_fix:
      - ['^Dy\s+namic\b', 'Dynamic']
    caveat: >-
      Dynamic keeps its statements for the most recent tax year behind its
      investor / advisor sign-in, so only earlier years - its public archive -
      can be collected here. For the latest year, sign in on Dynamic's PFIC
      page.
    notes: >-
      Two pages. The main PFIC page lists the current year, but every entry
      except the odd one is a "Sign in required" link to their login. The
      archive page linked from it carries the previous year in full (122
      statements for 2024) as ordinary public PDFs at
      /content/dam/docs/regulatory/pfic/{year}/{Fund-Name}.pdf, and robots.txt
      permits everything. So this family always runs a year behind. It was
      listed as "fetch by hand" until November 2026 because only the locked
      current-year page had been looked at.

  - id: franklin-templeton-ca
    name: Franklin Templeton Canada
    country: CA
    mode: static
    fye: "varies"
    hub: https://www.franklintempleton.ca/en-ca/resources/forms/pfic-annual-information-statements
    json_api:
      url: https://www.franklintempleton.ca/en-ca/resourceapi/resources/forms/pfic-annual-information-statements?first-load=true&segment=investor
      within: accordionItems
    link_include: ['franklintempletonprod\.widen\.net/']
    link_exclude: ['(?i)8937|tax-guide']
    listing_only:
      why: >-
        the documents are kept on franklintempletonprod.widen.net, whose robots.txt disallows everything
    caveat: >-
      Franklin Templeton's page does not say which tax year each statement is
      for; the links lead to whatever it currently posts. Check the period on
      the document.
    notes: >-
      LINKS ONLY. The PFIC page is an empty shell that loads its list from the
      resourceapi endpoint (which franklintempleton.ca's robots.txt permits):
      a table per asset class, fund name in one cell and a bare "PDF" link in
      the next. The PDFs themselves are on a Widen document host that
      disallows all automated access, so they are listed and never requested.

  - id: nei
    name: NEI Investments (Aviso)
    country: CA
    mode: static
    fye: "09-30"
    hub: https://www.neiinvestments.com/investment-products/fund-resources/fund-financials.html
    link_include: ['(?i)/regulatory/pfic/pfic-[0-9a-z]+-en\.pdf']
    caveat: >-
      NEI's funds have a 30 SEPTEMBER year end, not December. It posts one
      statement per fund at a fixed address and replaces it each year, so only
      the latest year is available here.
    notes: >-
      The statements are linked from the "Fund financials" page, in a column
      headed "PFIC annual statements" - not from any page with PFIC in its
      name, which is why none was found at first. Files are
      /content/dam/nei/docs/en/regulatory/pfic/pfic-{fund number}-en.pdf.
      robots.txt disallows only the advisor-marketing folders. September 30
      year end. Aviso Wealth is the parent.

  - id: starlight
    name: Starlight Capital
    country: CA
    mode: static
    fye: "12-31"
    hub: https://starlightcapital.com/en/prices/documents?category=Tax+Information
    url_scan: true
    link_include: ['(?i)/files/\d+/download/\d+/\d{4}-PFIC-Annual-Information-Statement$']
    caveat: >-
      Starlight reports amounts per unit PER DAY.
    notes: >-
      The statements are on the documents page (category "Tax Information"),
      not on the tax-information page, which links only a PFIC overview and
      FAQ. The documents table is built in the browser from data held in an
      HTML attribute, and the addresses carry no ".pdf" - hence url_scan.
      One statement per fund per year, 2023 onward. Listed as "not posted"
      until November 2026 because only the tax-information page had been read.

  - id: ninepoint
    name: Ninepoint Partners
    country: CA
    mode: static
    fye: "12-31"
    hub: https://www.ninepoint.com/pfic-annual-information-statements/
    link_include: ['(?i)/media/[^/]+/\d{4}-pfic-']
    notes: >-
      Umbraco-style media paths: /media/{hash}/{YEAR}-pfic-{fund}.pdf.
      The year is the filename prefix, so the year floor filters before download.

  - id: nbi
    name: National Bank Investments
    country: CA
    mode: static
    fye: "12-31"
    hub: https://www.nbinvestments.ca/regulatory-documents/pfic-statements.html
    link_include: ['(?i)/regulatory/pfic/.+\.pdf']
    notes: >-
      Large catalogue - ~475 documents across 2023-2025 at
      /content/dam/bni/en/fund/regulatory/pfic/{FUNDCODE}-pfic-{YEAR}.pdf.
      Note the FundSERV code is in the filename (e.g. MFAL0503), which makes
      this family a candidate for code-to-fund mapping.

  - id: sprott
    name: Sprott
    country: CA
    mode: static
    fye: "12-31"
    hub: https://sprott.com/investment-strategies/exchange-listed-products/physical-bullion-funds/tax-guide/
    link_include: ['(?i)/media/[^/]+/\d{4}-[a-z]+-pfic\.pdf']
    # The text layer of these statements splits the name: "SPROT T PHYSICAL ...", "SPRO TT PHYSICAL ...".
    name_fix:
      - ['(?i)spro\s*t\s*t\s*(?=physical)', 'SPROTT ']
    notes: >-
      Physical bullion trusts (PHYS, PSLV, CEF, SPUT, SPPP, COP). Filenames are
      {YEAR}-{ticker}-pfic.pdf, so both the year and the exchange ticker come
